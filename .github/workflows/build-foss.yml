name: Build FOSS APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-foss:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
          
      - name: Build FOSS Release APK
        run: ./gradlew assembleFossRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SDMaidSE-FOSS
          path: app/build/outputs/apk/foss/release/*.apk